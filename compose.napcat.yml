services:
  waifu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openqqwaifu
    command:
      [
        "sh",
        "-lc",
        "test -f /app/data/docker-compose-config.json || cp /app/examples/config.napcat.compose.json /app/data/docker-compose-config.json && python run_cli.py serve --config /app/data/docker-compose-config.json",
      ]
    environment:
      OPENQQWAIFU_DATA_ROOT: /app/data
      OPENQQWAIFU_CONTAINER_HOSTNAME: openqqwaifu
      OPENQQWAIFU_QQ_SIDECAR_CALLBACK_BASE_URL: http://openqqwaifu:8080
      OPENQQWAIFU_QQ_SIDECAR_GATEWAY_MODE: ${OPENQQWAIFU_QQ_SIDECAR_GATEWAY_MODE:-http}
      OPENQQWAIFU_QQ_SIDECAR_REVERSE_WS_URL: ${OPENQQWAIFU_QQ_SIDECAR_REVERSE_WS_URL:-ws://openqqwaifu:8080/onebot/v11/ws}
      OPENQQWAIFU_QQ_SIDECAR_REVERSE_WS_ACCESS_TOKEN: ${OPENQQWAIFU_QQ_SIDECAR_REVERSE_WS_ACCESS_TOKEN:-}
      OPENQQWAIFU_QQ_SIDECAR_WEBUI_BASE_URL: http://napcat:6099
      OPENQQWAIFU_QQ_SIDECAR_WEBUI_API_PREFIX: /api
      OPENQQWAIFU_QQ_SIDECAR_WEBUI_TIMEOUT_SECONDS: ${OPENQQWAIFU_QQ_SIDECAR_WEBUI_TIMEOUT_SECONDS:-10}
      OPENQQWAIFU_QQ_SIDECAR_WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./napcat/config:/app/napcat-sidecar/config
    ports:
      - "${OPENQQWAIFU_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      - napcat
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    environment:
      ACCOUNT: "${ACCOUNT:-}"
    ports:
      - "${NAPCAT_HTTP_PORT:-3000}:3000"
      - "${NAPCAT_WS_PORT:-3001}:3001"
      - "${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ./napcat/qq:/app/.config/QQ
      - ./napcat/config:/app/napcat/config
    restart: unless-stopped
