services:
  waifu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openqqwaifu
    command:
      [
        "sh",
        "-lc",
        "test -f /app/data/docker-compose-config.json || cp /app/examples/config.napcat.compose.json /app/data/docker-compose-config.json && python run_cli.py serve --config /app/data/docker-compose-config.json",
      ]
    environment:
      OPENQQWAIFU_DATA_ROOT: /app/data
      OPENQQWAIFU_CONTAINER_HOSTNAME: openqqwaifu
      OPENQQWAIFU_QQ_SIDECAR_CALLBACK_BASE_URL: http://openqqwaifu:8080
      OPENQQWAIFU_QQ_SIDECAR_INBOUND_ACCESS_TOKEN: ${OPENQQWAIFU_QQ_SIDECAR_INBOUND_ACCESS_TOKEN:-}
      OPENQQWAIFU_QQ_SIDECAR_GATEWAY_MODE: ${OPENQQWAIFU_QQ_SIDECAR_GATEWAY_MODE:-reverse_ws}
      OPENQQWAIFU_QQ_SIDECAR_REVERSE_WS_URL: ${OPENQQWAIFU_QQ_SIDECAR_REVERSE_WS_URL:-ws://openqqwaifu:8080/onebot/v11/ws}
      OPENQQWAIFU_QQ_SIDECAR_REVERSE_WS_ACCESS_TOKEN: ${OPENQQWAIFU_QQ_SIDECAR_REVERSE_WS_ACCESS_TOKEN:-}
      OPENQQWAIFU_QQ_SIDECAR_WEBUI_BASE_URL: http://napcat:6099
      OPENQQWAIFU_QQ_SIDECAR_WEBUI_API_PREFIX: /api
      OPENQQWAIFU_QQ_SIDECAR_WEBUI_TIMEOUT_SECONDS: ${OPENQQWAIFU_QQ_SIDECAR_WEBUI_TIMEOUT_SECONDS:-10}
      OPENQQWAIFU_QQ_SIDECAR_WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}
      # The tavern's cards are played by SillyTavern, in its page kept open by the browser below.
      OPENQQWAIFU_TAVERN_SILLYTAVERN_URL: http://sillytavern:8000/
      OPENQQWAIFU_TAVERN_BROWSER_URL: http://browser:9222
    volumes:
      - ./data:/app/data
      - ./napcat/config:/app/napcat-sidecar/config
    ports:
      - "${OPENQQWAIFU_PORT:-8080}:8080"
    networks:
      - default
      - tavern
    restart: unless-stopped
    depends_on:
      - napcat
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  napcat:
    # Pinned: a new NapCat/QQ build can invalidate the saved login or the QQ data
    # directory. Upgrade on purpose, and be ready to scan a QR code afterwards.
    image: mlikiowa/napcat-docker:v4.18.41
    container_name: napcat
    environment:
      ACCOUNT: "${ACCOUNT:-}"
    ports:
      - "${NAPCAT_HTTP_PORT:-3000}:3000"
      - "${NAPCAT_WS_PORT:-3001}:3001"
      - "${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ./napcat/qq:/app/.config/QQ
      - ./napcat/config:/app/napcat/config
    restart: unless-stopped

  sillytavern:
    # Pinned: the tavern drives SillyTavern's own page (tavern/sillytavern_page.js), which can
    # change between releases. Upgrade on purpose and play a round in dry_run first.
    image: ghcr.io/sillytavern/sillytavern:1.19.0
    container_name: sillytavern
    environment:
      # Only this machine (through the port below) and the tavern network may open it.
      SILLYTAVERN_WHITELIST: '["127.0.0.1", "::1", "172.30.87.0/24"]'
    volumes:
      - ./sillytavern/config:/home/node/app/config
      - ./sillytavern/data:/home/node/app/data
    ports:
      - "127.0.0.1:${SILLYTAVERN_PORT:-8000}:8000"
    networks:
      - tavern
    restart: unless-stopped

  browser:
    # Headless Chrome that keeps SillyTavern's page open for the tavern (DevTools on 9222,
    # reachable only on the tavern network).
    image: chromedp/headless-shell:157.0.8103.27
    container_name: sillytavern-browser
    shm_size: 1g
    networks:
      - tavern
    restart: unless-stopped

networks:
  tavern:
    ipam:
      config:
        - subnet: 172.30.87.0/24
