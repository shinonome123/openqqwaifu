[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openqqwaifu"
version = "0.1.0"
description = "openqqwaifu: 独立运行的 QQ Waifu 控制台与 OneBot/NapCat 运行时"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "aiohttp>=3.13,<4",
  "httpx>=0.25,<1",
  "qrcode[pil]>=7.4.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waifu_standalone = ["web/*.html", "web/*.css", "web/*.js", "templates/*.yaml", "builtin_skills/*.md"]
