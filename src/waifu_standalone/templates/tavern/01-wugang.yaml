title: 雾港酒馆
intro: 沉船、海图和一个倒在门口的信使
kind: story
Setting:
  - 雾港是一座终年起雾的海港城，靠走私和捕鲸过活。城里说了算的有三方：港务卫队、走私帮会「黑潮」，还有住在废灯塔里、谁也说不清来历的守灯人。
  - 玩家们都在「灰鸦酒馆」落脚，可以是水手、佣兵、落魄学者、小偷或者别的什么人，由玩家自己说。
  - 风格：海港冒险，带一点悬疑，节奏轻快。世界里有少量魔法，但很稀罕，普通人见了会害怕。
Notes:
  - 倒在门口的信使叫科尔，是黑潮的叛徒。他偷走了一张海图，上面标着三天前沉没的「银鲭号」的位置。
  - 银鲭号明面上运的是香料，底舱其实锁着守灯人被绑走的女儿，还有一箱会在雾里发光的「海月石」。
  - 黑潮的打手当晚就会追到酒馆；港务卫队的副队长和黑潮有勾结，玩家去报官会被出卖。
  - 守灯人知道沉船的真相，愿意拿一件旧魔法道具（能在雾中指路的铜罗盘）换女儿平安。
  - 可能的走向：护送科尔、和黑潮周旋、夜里驾小船出海找沉船、去灯塔做交易。不必按顺序，跟着玩家的选择走。
Opening:
  - 夜里十一点，雾浓得看不清对面的街灯。灰鸦酒馆里炉火噼啪作响，几个水手在角落里掷骰子赌钱。
  - 门忽然被撞开，一个浑身湿透的年轻人跌了进来，肩上插着半截弩箭。他把一卷油布包着的东西塞进离门最近的人手里，嘶哑地说：「别……别给黑潮……」话没说完就晕了过去。
  - 门外的雾里传来几个人奔跑的脚步声，越来越近。
  - 你们在酒馆里做什么？现在打算怎么办？
