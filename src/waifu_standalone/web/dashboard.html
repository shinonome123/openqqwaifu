<!doctype html>
<html lang="en" data-theme-mode="dark" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>openqqwaifu</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5c5c'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dominant-baseline='central' font-family='system-ui' font-size='18' font-weight='700' fill='white'%3EW%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages.css" />
    <script>
      (function preflightTheme() {
        try {
          const saved = JSON.parse(localStorage.getItem("waifu:prefs") || "{}");
          const mode =
            saved.themeMode ||
            (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          const family = saved.themeFamily || "default";
          const lang =
            saved.lang || (navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");
          document.documentElement.setAttribute("data-theme-mode", mode);
          document.documentElement.setAttribute("data-theme", family);
          document.documentElement.setAttribute("lang", lang);
        } catch (err) {
          // ignore bootstrap preference issues
        }
      })();
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Primary">
        <div class="sidebar-head">
          <a class="sidebar-brand" href="#overview" aria-label="openqqwaifu">
            <img
              src="/assets/img/brand-logo.png"
              alt=""
              class="sidebar-brand-logo"
              width="36"
              height="36"
            />
            <span class="sidebar-brand-text">
              <span class="sidebar-brand-name" data-i18n="brand.name">openqqwaifu</span>
              <span class="sidebar-brand-sub" data-i18n="brand.sub">QQ Waifu control plane</span>
            </span>
          </a>
          <button
            type="button"
            class="sidebar-collapse"
            id="sidebar-collapse"
            aria-label="Collapse sidebar"
            title="Collapse"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
        </div>

        <nav class="nav" id="nav" aria-label="Sections"></nav>

        <div class="sidebar-footer">
          <span class="sidebar-footer-dot" id="health-dot" aria-hidden="true"></span>
          <span class="sidebar-footer-text" id="health-text" data-i18n="sidebar.health.unknown">
            Checking health...
          </span>
        </div>
      </aside>

      <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>

      <header class="topbar">
        <button
          type="button"
          class="icon-btn topbar-mobile-toggle"
          id="sidebar-toggle"
          aria-label="Open navigation"
          title="Open navigation"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="18" x2="20" y2="18" />
          </svg>
        </button>

        <div class="topbar-heading">
          <span class="topbar-eyebrow" id="page-crumb" data-i18n="nav.group.control">
            Control
          </span>
          <h1 class="topbar-title" id="page-title" data-i18n="page.overview.title">
            Overview
          </h1>
        </div>

        <div class="topbar-spacer"></div>

        <div class="topbar-actions">
          <button type="button" class="btn is-ghost is-sm" id="topbar-user" hidden></button>

          <div class="lang-picker" role="group" aria-label="Language">
            <button type="button" data-lang="en" class="is-active">EN</button>
            <button type="button" data-lang="zh">中文</button>
          </div>

          <button
            type="button"
            class="icon-btn"
            id="theme-toggle"
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            <svg
              class="theme-icon-dark"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg
              class="theme-icon-light"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              hidden
            >
              <circle cx="12" cy="12" r="4" />
              <line x1="12" y1="2" x2="12" y2="5" />
              <line x1="12" y1="19" x2="12" y2="22" />
              <line x1="2" y1="12" x2="5" y2="12" />
              <line x1="19" y1="12" x2="22" y2="12" />
              <line x1="4.93" y1="4.93" x2="7.05" y2="7.05" />
              <line x1="16.95" y1="16.95" x2="19.07" y2="19.07" />
              <line x1="4.93" y1="19.07" x2="7.05" y2="16.95" />
              <line x1="16.95" y1="7.05" x2="19.07" y2="4.93" />
            </svg>
          </button>

          <button
            type="button"
            class="btn is-primary is-sm"
            id="save-config"
            data-i18n="actions.save"
          >
            Save
          </button>
        </div>
      </header>

      <main class="main" id="main" tabindex="-1">
        <div class="main-inner" id="page-outlet">
          <div class="empty">
            <div class="loading-spinner" aria-hidden="true"></div>
            <div class="empty-title" data-i18n="common.loading">Loading...</div>
          </div>
        </div>
      </main>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>
    <div class="modal-overlay" id="modal-root" role="dialog" aria-modal="true" hidden></div>

    <script type="module" src="/assets/js/main.js"></script>
  </body>
</html>
